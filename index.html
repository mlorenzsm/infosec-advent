<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1411">
<title>24 Tage Informationssicherheit</title>
<meta name="description" content="24 Tage Informationssicherheit – ein Türchen pro Tag für den Adventskalender am Infostand.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1411'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23E8B84B' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23E8B84B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<main class="stage">
  <header class="masthead">
    <h1 class="title" id="title">24 Tage Informationssicherheit</h1>
  </header>

  <div class="garland" id="garland" aria-hidden="true"></div>

  <ol class="board" id="board" aria-label="Adventskalender">
    <noscript><li class="board-error">Bitte JavaScript einschalten – der Kalender braucht es.</li></noscript>
  </ol>

  <footer class="foot">
    <div class="foot-cell foot-date">
      <span class="foot-label" id="date-label">Heute</span>
      <span class="foot-value" id="date-value"></span>
    </div>
    <div class="foot-cell foot-progress">
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0">
        <span class="bar-fill" id="bar-fill"></span>
      </div>
      <span class="foot-hint" id="hint"></span>
    </div>
    <div class="foot-cell foot-clock">
      <span class="foot-label" id="clock-label">Uhrzeit</span>
      <span class="foot-value foot-mono" id="clock-value">--:--</span>
    </div>
  </footer>
</main>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
  <div class="detail-card" id="detail-card"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="static/app.js"></script>
</body>
</html>
